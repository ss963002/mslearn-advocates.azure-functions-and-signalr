# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - imaiappuser

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: imairegistryruser.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C2C68383E8F94D8993DF1EF1E1C7365D }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_F80F60FC422A4F31A517E712918CA5C4 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: imairegistryruser.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C2C68383E8F94D8993DF1EF1E1C7365D }}/webimage:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F0D5AE8FC22F4DFCB8CE78402A25EDC7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_63BF981E44C04F549FCC2DA353F46E4C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3B0CF2628AEA4B5F8C33FF24E280CB61 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'imaiappuser'
          slot-name: 'Production'
          images: 'imairegistryruser.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C2C68383E8F94D8993DF1EF1E1C7365D }}/webimage:${{ github.sha }}'
          